name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lockfile integrity
        # npm ci never rewrites the lockfile; if anything changed it, fail.
        run: git diff --exit-code -- package-lock.json

      - name: Audit production dependencies (high+)
        # Gate shipped code on high/critical advisories. Dev-only tooling (e.g.
        # @capacitor/cli -> tar) is excluded via --omit=dev and tracked in
        # docs/security-ci.md; a full informational audit runs in security.yml.
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:run

      - name: Repository compliance gates
        run: npm run verify:app-store-sections-1-8 -- --allow-external-blockers --no-write-evidence

      - name: Build
        run: npm run build
        env:
          # Dummy values — CI only typechecks/builds, it never connects anywhere.
          # The validated env layer (@/env) requires these to be present + well-formed.
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key-aaaaaaaaaaaaaaaaaaaa
          SUPABASE_SERVICE_ROLE_KEY: ci-service-role-aaaaaaaaaaaaaaaaaaaa
          TOKEN_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          CRON_SECRET: ci-dummy-cron-secret-0123456789
          # This compiles repository code without pretending the dummy identity
          # is deployable. Vercel/Codemagic release builds cannot use this path.
          LEGAL_REPOSITORY_BUILD: "true"
