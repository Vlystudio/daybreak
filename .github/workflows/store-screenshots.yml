name: Store screenshots

on:
  workflow_dispatch:
  push:
    branches: [codex/app-store-launch-readiness]
    paths:
      - .github/workflows/store-screenshots.yml
      - scripts/ios-install-store-screenshots.rb
      - scripts/run-store-screenshots.py
      - native/ios/StoreScreenshots/**

permissions:
  contents: read

concurrency:
  group: store-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    if: github.repository == 'Vlystudio/daybreak'
    runs-on: macos-15-arm64
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        device: ["iPhone 16 Pro Max", "iPad Pro 13-inch (M4)"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer
      - run: npm ci --no-audit --no-fund
      - name: Prepare unchanged production shell and capture target
        run: |
          npm run licenses:build
          node scripts/capacitor-cli.mjs add ios
          bash scripts/ios-prepare.sh
          node scripts/capacitor-cli.mjs sync ios
          ruby scripts/ios-install-store-screenshots.rb
          cd ios/App && pod install
      - name: Capture actual simulator screens
        run: python3 scripts/run-store-screenshots.py
        env:
          DAYBREAK_SCREENSHOT_DEVICE: ${{ matrix.device }}
          DAYBREAK_REVIEW_EMAIL: ${{ secrets.DAYBREAK_REVIEW_EMAIL }}
          DAYBREAK_REVIEW_PASSWORD: ${{ secrets.DAYBREAK_REVIEW_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: store-screenshots-${{ strategy.job-index }}
          path: build/store-screenshots/
          retention-days: 7
          if-no-files-found: error
