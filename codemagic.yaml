# Cloud iOS build for the Daybreak HealthKit app — no Mac required.
#
# One-time setup in the Codemagic UI (see docs/apple-health-phase-2.md):
#   1. Connect this repo.
#   2. Add the "App Store Connect API key" integration (Team API key).
#   3. In the Apple Developer portal, enable the HealthKit capability on the
#      App ID app.daybreak.mobile.
#   4. Set BUNDLE_ID below (already app.daybreak.mobile) and your APPLE_TEAM_ID
#      in an environment group named "appstore".
#
# Then: push to main → Codemagic builds, signs, and ships to TestFlight.

workflows:
  ios-healthkit:
    name: Daybreak iOS (HealthKit) → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Daybreak ASC Key # name of the API key added in Codemagic
    environment:
      groups:
        - appstore # must define APPLE_TEAM_ID
      vars:
        BUNDLE_ID: "app.daybreak.mobile"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install JS dependencies
        # `npm install` (not `npm ci`): the package-lock.json is generated on
        # Windows and omits macOS-only optional deps (e.g. @emnapi/*), which makes
        # `npm ci`'s strict lock match fail on the Mac build machine. `npm install`
        # resolves the correct per-platform tree at build time.
        script: npm install --no-audit --no-fund
      - name: Generate iOS platform
        script: |
          npx cap add ios || echo "ios already added"
      - name: Inject HealthKit plugin, entitlements, Info.plist
        script: |
          chmod +x scripts/ios-prepare.sh
          HEALTH_DOMAIN="daybreak-one.vercel.app" bash scripts/ios-prepare.sh
      - name: Capacitor sync
        script: npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd ios/App && pod install
      - name: Prepare signing certificate + API key
        script: |
          keychain initialize
          # Get/create the distribution certificate into the build keychain.
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create || true
          keychain add-certificates
          # Put the App Store Connect API key on disk so xcodebuild can manage
          # provisioning itself (see Build IPA).
          mkdir -p "$HOME/private_keys"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8"
      - name: Bump build number
        script: |
          cd ios/App
          # Codemagic's per-project build counter — always increasing, which
          # App Store Connect requires for each new TestFlight upload.
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Build IPA (Xcode-managed signing — syncs the HealthKit capability)
        script: |
          # Let Xcode create/update the provisioning profile via the App Store
          # Connect API (-allowProvisioningUpdates). This reliably includes
          # capabilities like HealthKit that API-created profiles can miss.
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8 -authenticationKeyID $APP_STORE_CONNECT_KEY_IDENTIFIER -authenticationKeyIssuerID $APP_STORE_CONNECT_ISSUER_ID"
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --archive-xcargs "$AUTH CODE_SIGN_STYLE=Automatic DEVELOPMENT_TEAM=$APPLE_TEAM_ID" \
            --export-xcargs "$AUTH"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
