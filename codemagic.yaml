# Cloud iOS build for the Daybreak HealthKit app — no Mac required.
#
# One-time setup in the Codemagic UI (see docs/apple-health-phase-2.md):
#   1. Connect this repo.
#   2. Add the "App Store Connect API key" integration (Team API key).
#   3. In the Apple Developer portal, enable the HealthKit capability on the
#      App ID app.daybreak.mobile.
#   4. Set BUNDLE_ID below (already app.daybreak.mobile) and your APPLE_TEAM_ID
#      in an environment group named "appstore".
#
# Then: push to main → Codemagic builds, signs, and ships to TestFlight.

workflows:
  ios-healthkit:
    name: Daybreak iOS (HealthKit) → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    # Auto-build every push to main. Without this block, pushing to main builds
    # NOTHING (the comment at the top of this file long claimed it did, but the
    # trigger was never wired), so fixes merged to main never reached TestFlight
    # until a build was started by hand. Requires the Codemagic webhook to be
    # installed on the repo (automatic once the app is connected in Codemagic).
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    integrations:
      app_store_connect: Daybreak ASC Key # name of the API key added in Codemagic
    environment:
      groups:
        - appstore # must define APPLE_TEAM_ID
      vars:
        BUNDLE_ID: "app.daybreak.mobile"
        APP_VERSION: "1.0.0"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 22
      xcode: 26.0
      cocoapods: default
    scripts:
      - name: Install JS dependencies
        script: npm ci --no-audit --no-fund
      - name: Generate iOS platform
        script: |
          if [ ! -d ios ]; then
            npx cap add ios
          fi
      - name: Inject HealthKit plugin, entitlements, Info.plist
        script: |
          chmod +x scripts/ios-prepare.sh
          HEALTH_DOMAIN="daybreak-one.vercel.app" bash scripts/ios-prepare.sh
      - name: Capacitor sync
        script: npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd ios/App && pod install
      - name: Validate generated iOS project
        script: |
          chmod +x scripts/ios-release-validate.sh
          bash scripts/ios-release-validate.sh
      - name: Set up code signing (manual — distribution cert + HealthKit profile)
        script: |
          set -euo pipefail
          : "${APPLE_TEAM_ID:?Missing APPLE_TEAM_ID in appstore environment group}"
          : "${CM_CERTIFICATE:?Missing base64 distribution certificate}"
          : "${CM_CERTIFICATE_PASSWORD:?Missing distribution certificate password}"
          : "${CM_PROVISIONING_PROFILE:?Missing base64 provisioning profile}"
          : "${BUILD_NUMBER:?Codemagic BUILD_NUMBER is unavailable}"

          keychain initialize
          # App-Store-Connect-API-created profiles drop the HealthKit entitlement,
          # so we use a distribution certificate + a portal-created profile (which
          # includes HealthKit), supplied as base64 env vars.
          echo "$CM_CERTIFICATE" | base64 --decode > /tmp/dist.p12
          openssl pkcs12 -in /tmp/dist.p12 -passin env:CM_CERTIFICATE_PASSWORD -noout
          keychain add-certificates --certificate /tmp/dist.p12 --certificate-password "$CM_CERTIFICATE_PASSWORD"
          PROFILES_HOME="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_HOME"
          echo "$CM_PROVISIONING_PROFILE" | base64 --decode > "$PROFILES_HOME/daybreak.mobileprovision"
          # Validate the profile without printing its UUID, certificate, or raw
          # entitlements into the build log.
          security cms -D -i "$PROFILES_HOME/daybreak.mobileprovision" > /tmp/daybreak-profile.plist
          PROFILE_TEAM=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" /tmp/daybreak-profile.plist)
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" /tmp/daybreak-profile.plist)
          [ "$PROFILE_TEAM" = "$APPLE_TEAM_ID" ] || { echo "error: provisioning profile team mismatch" >&2; exit 1; }
          [ "$PROFILE_APP_ID" = "$APPLE_TEAM_ID.$BUNDLE_ID" ] || { echo "error: provisioning profile bundle mismatch" >&2; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.developer.healthkit" /tmp/daybreak-profile.plist >/dev/null
          # Wire the profile into the project (manual signing) + generate export options.
          xcode-project use-profiles
          rm -f /tmp/dist.p12 /tmp/daybreak-profile.plist
      - name: Bump build number
        script: |
          cd ios/App
          agvtool new-marketing-version "$APP_VERSION"
          # Codemagic's per-project build counter — always increasing, which
          # App Store Connect requires for each new TestFlight upload.
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
      - name: Validate release archive
        script: |
          IPA_PATH="$(find build/ios/ipa -name '*.ipa' -type f | head -1)" bash scripts/ios-release-validate.sh
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive/dSYMs/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
