# Cloud iOS build for the Daybreak HealthKit app — no Mac required.
#
# One-time setup in the Codemagic UI (see docs/apple-health-phase-2.md):
#   1. Connect this repo.
#   2. Add the "App Store Connect API key" integration (Team API key).
#   3. In the Apple Developer portal, enable the HealthKit capability on the
#      App ID app.daybreak.mobile.
#   4. Set BUNDLE_ID below (already app.daybreak.mobile) and your APPLE_TEAM_ID
#      in an environment group named "appstore".
#
# Then: push to main → Codemagic builds, signs, and ships to TestFlight.

workflows:
  ios-healthkit: &ios_release
    name: Daybreak iOS (HealthKit) → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    cache:
      cache_paths:
        - $CM_BUILD_DIR/node_modules/.cache
        - $HOME/Library/Caches/CocoaPods
        - $HOME/.npm
    # Auto-build every push to main. Without this block, pushing to main builds
    # NOTHING (the comment at the top of this file long claimed it did, but the
    # trigger was never wired), so fixes merged to main never reached TestFlight
    # until a build was started by hand. Requires the Codemagic webhook to be
    # installed on the repo (automatic once the app is connected in Codemagic).
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    integrations:
      app_store_connect: Daybreak ASC Key # name of the API key added in Codemagic
    environment:
      groups:
        - appstore # must define APPLE_TEAM_ID
      vars:
        BUNDLE_ID: "app.daybreak.mobile"
        # Existing Daybreak Companion record, verified against prior ASC upload.
        APP_STORE_APPLE_ID: "6784789934"
        APP_VERSION: "1.0.0"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 22
      xcode: 26.0
      cocoapods: default
    scripts:
      - &install_dependencies
        name: Install JS dependencies
        script: npm ci --no-audit --no-fund
      - &verify_repository
        name: Verify repository release controls
        script: |
          set -euo pipefail
          npm run typecheck
          npm run lint
          npm run test:run
          npm run compliance:generate
          git diff --exit-code
          npm run compliance:check
          npm run check:migrations
          npm run migration:discover:static
          npm run verify:app-store-sections-1-8 -- --allow-external-blockers --no-write-evidence
      - name: Verify public release approvals and runtime configuration
        script: npm run release:verify-production
      - &generate_assets
        name: Generate and verify deterministic iOS assets
        script: |
          set -euo pipefail
          npm run licenses:build
          npm run ios:assets
          git diff --exit-code -- native/ios
      - &generate_platform
        name: Generate iOS platform
        script: |
          if [ ! -d ios ]; then
            node scripts/capacitor-cli.mjs add ios
          fi
      - &prepare_native
        name: Inject HealthKit plugin, entitlements, Info.plist
        script: |
          chmod +x scripts/ios-prepare.sh
          HEALTH_DOMAIN="daybreak-one.vercel.app" bash scripts/ios-prepare.sh
      - &sync_capacitor
        name: Capacitor sync
        script: node scripts/capacitor-cli.mjs sync ios
      - &install_pods
        name: Install CocoaPods
        script: |
          cd ios/App && pod install
      - &validate_project
        name: Validate generated iOS project
        script: |
          chmod +x scripts/ios-release-validate.sh
          bash scripts/ios-release-validate.sh
      - &setup_signing
        name: Set up code signing (manual — distribution cert + HealthKit profile)
        script: |
          set -euo pipefail
          : "${APPLE_TEAM_ID:?Missing APPLE_TEAM_ID in appstore environment group}"
          : "${CM_CERTIFICATE:?Missing base64 distribution certificate}"
          : "${CM_CERTIFICATE_PASSWORD:?Missing distribution certificate password}"
          : "${CM_PROVISIONING_PROFILE:?Missing base64 provisioning profile}"
          : "${APP_STORE_APPLE_ID:?Missing numeric APP_STORE_APPLE_ID in appstore environment group}"
          [[ "$APP_STORE_APPLE_ID" =~ ^[0-9]+$ ]] || { echo "error: APP_STORE_APPLE_ID must be numeric" >&2; exit 1; }

          cleanup_signing_files() {
            rm -f /tmp/dist.p12 /tmp/daybreak-profile.plist
          }
          trap cleanup_signing_files EXIT

          keychain initialize
          # App-Store-Connect-API-created profiles drop the HealthKit entitlement,
          # so we use a distribution certificate + a portal-created profile (which
          # includes HealthKit), supplied as base64 env vars.
          printf '%s' "$CM_CERTIFICATE" | base64 --decode > /tmp/dist.p12
          # Existing Apple-exported PKCS#12 uses RC2 encryption. OpenSSL 3
          # needs its legacy reader; certificate and signature checks stay on.
          openssl pkcs12 -legacy -in /tmp/dist.p12 -passin env:CM_CERTIFICATE_PASSWORD -noout
          keychain add-certificates --certificate /tmp/dist.p12 --certificate-password "$CM_CERTIFICATE_PASSWORD"
          PROFILES_HOME="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_HOME"
          printf '%s' "$CM_PROVISIONING_PROFILE" | base64 --decode > "$PROFILES_HOME/daybreak.mobileprovision"
          # Validate the profile without printing its UUID, certificate, or raw
          # entitlements into the build log.
          security cms -D -i "$PROFILES_HOME/daybreak.mobileprovision" > /tmp/daybreak-profile.plist
          PROFILE_TEAM=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" /tmp/daybreak-profile.plist)
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" /tmp/daybreak-profile.plist)
          [ "$PROFILE_TEAM" = "$APPLE_TEAM_ID" ] || { echo "error: provisioning profile team mismatch" >&2; exit 1; }
          [ "$PROFILE_APP_ID" = "$APPLE_TEAM_ID.$BUNDLE_ID" ] || { echo "error: provisioning profile bundle mismatch" >&2; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.developer.healthkit" /tmp/daybreak-profile.plist >/dev/null
          # Wire the profile into the project (manual signing) + generate export options.
          xcode-project use-profiles
          cleanup_signing_files
          trap - EXIT
      - &bump_build_number
        name: Bump build number
        script: |
          set -euo pipefail
          : "${APP_STORE_APPLE_ID:?Missing numeric APP_STORE_APPLE_ID in appstore environment group}"
          : "${CM_ENV:?Codemagic CM_ENV file is unavailable}"
          [[ "$APP_STORE_APPLE_ID" =~ ^[0-9]+$ ]] || { echo "error: APP_STORE_APPLE_ID must be numeric" >&2; exit 1; }
          LATEST_BUILD_NUMBER="$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID")"
          [[ "$LATEST_BUILD_NUMBER" =~ ^[0-9]+$ ]] || { echo "error: App Store Connect did not return a numeric build number" >&2; exit 1; }
          CANDIDATE_BUILD_NUMBER="$((LATEST_BUILD_NUMBER + 1))"
          printf 'CANDIDATE_BUILD_NUMBER=%s\n' "$CANDIDATE_BUILD_NUMBER" >> "$CM_ENV"
          cd ios/App
          agvtool new-marketing-version "$APP_VERSION"
          # Select the next value from the existing App Store record so it stays
          # monotonic even if Codemagic's project counter is reset.
          agvtool new-version -all "$CANDIDATE_BUILD_NUMBER"
      - &build_ipa
        name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --archive-directory build/ios/archive
      - &validate_archive
        name: Validate release archive
        script: |
          set -euo pipefail
          IPA_PATH="$(find build/ios/ipa -name '*.ipa' -type f | head -1)"
          ARCHIVE_PATH="$(find build/ios/archive -name '*.xcarchive' -type d | head -1)"
          DSYM_PATH="$(find "$ARCHIVE_PATH/dSYMs" -name '*.dSYM' -type d | head -1)"
          IPA_PATH="$IPA_PATH" \
          ARCHIVE_PATH="$ARCHIVE_PATH" \
          DSYM_PATH="$DSYM_PATH" \
          EXPECTED_APP_VERSION="$APP_VERSION" \
          EXPECTED_BUILD_NUMBER="$CANDIDATE_BUILD_NUMBER" \
          EXPECTED_TEAM_ID="$APPLE_TEAM_ID" \
          EVIDENCE_OUTPUT="build/release-evidence/ios-archive.json" \
            bash scripts/ios-release-validate.sh
          # These two generated records contain only sanitized archive metadata.
          # Keep them readable in the authenticated build log as well as artifacts.
          cat build/release-evidence/ios-archive.json
          cat build/release-evidence/ios-privacy-inventory.json
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
      - build/ios/archive/*.xcarchive/dSYMs/**/*.dSYM
      - build/release-evidence/*.json
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  # Device testing must precede public release approval. This manual workflow
  # exports an Apple-enforced INTERNAL-ONLY binary. It cannot reach external
  # testers or the App Store, and does not alter the public release gate above.
  ios-testflight-internal:
    <<: *ios_release
    name: Daybreak iOS — Internal TestFlight candidate
    triggering:
      events: []
    scripts:
      - *install_dependencies
      - *verify_repository
      - name: Verify live web app and record outstanding launch approvals
        script: node scripts/verify-testflight-runtime.mjs
      - *generate_assets
      - *generate_platform
      - *prepare_native
      - *sync_capacitor
      - *install_pods
      - *validate_project
      - *setup_signing
      - name: Restrict this candidate to internal TestFlight testing
        script: |
          set -euo pipefail
          xcode-project use-profiles --custom-export-options='{"testFlightInternalTestingOnly": true}'
          [ "$(/usr/libexec/PlistBuddy -c 'Print :testFlightInternalTestingOnly' "$HOME/export_options.plist")" = "true" ]
      - *bump_build_number
      - *build_ipa
      - *validate_archive
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false

  # Build an App Store-eligible candidate for device QA before submission.
  # Uploading does not submit to App Review or release the app. Outstanding
  # public-launch evidence is retained and must be resolved before submission.
  ios-app-store-candidate:
    <<: *ios_release
    name: Daybreak iOS — App Store release candidate
    triggering:
      events: []
    scripts:
      - *install_dependencies
      - *verify_repository
      - name: Verify live runtime and record pending release evidence
        script: node scripts/verify-testflight-runtime.mjs
      - *generate_assets
      - *generate_platform
      - *prepare_native
      - *sync_capacitor
      - *install_pods
      - *validate_project
      - *setup_signing
      - name: Export an App Store-eligible candidate
        script: |
          set -euo pipefail
          xcode-project use-profiles --custom-export-options='{"testFlightInternalTestingOnly": false}'
          [ "$(/usr/libexec/PlistBuddy -c 'Print :testFlightInternalTestingOnly' "$HOME/export_options.plist")" = "false" ]
      - *bump_build_number
      - *build_ipa
      - *validate_archive
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
